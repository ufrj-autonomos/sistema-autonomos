name: Validate application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: autonomos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/autonomos_test
      DIRECT_URL: postgresql://postgres:ci-only-password@localhost:5432/autonomos_test
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/autonomos_test
      NEXT_PUBLIC_APP_URL: https://ci.example.invalid
      JWT_SECRET: ci-only-signing-key-not-for-production-32-characters
      CRON_SECRET: ci-only-maintenance-key-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:deploy
      - run: npm test
      - run: npm run test:database
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - run: npm run build
